<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Carnet de Vol"/>
<meta name="theme-color" content="#060d18"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title>Carnet de Vol</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:    #060d18;
  --bg2:   #0b1828;
  --bg3:   #0f2035;
  --line:  #152840;
  --acc:   #3d8ef0;
  --acc2:  #1558bb;
  --gold:  #e8a020;
  --text:  #c8daf0;
  --muted: #3d5570;
  --mono:  'Share Tech Mono', monospace;
  --sans:  'Outfit', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  flex-shrink: 0;
  background: linear-gradient(180deg,#0d1f38,var(--bg));
  border-bottom: 1px solid var(--line);
  padding: 14px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
}
.hd-left { display:flex; align-items:center; gap:10px; }
.hd-icon { font-size:22px; }
.hd-title { font-family:var(--mono); font-size:13px; color:#ddeeff; letter-spacing:2px; }
.hd-sub { font-family:var(--mono); font-size:9px; color:var(--acc); letter-spacing:3px; margin-top:2px; }
#pilot-badge { display:none; text-align:right; }
#pilot-badge .pb-name { font-family:var(--mono); font-size:11px; color:#ddeeff; }
#pilot-badge .pb-years { font-family:var(--mono); font-size:9px; color:var(--muted); margin-top:2px; }

/* ── SCROLL AREA ── */
#scroll-area {
  flex:1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 16px calc(80px + var(--safe-bottom));
}

/* ── API SETUP ── */
.setup-card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}
.setup-label { font-family:var(--mono); font-size:9px; letter-spacing:2.5px; color:var(--muted); margin-bottom:10px; text-transform:uppercase; }
.api-row { display:flex; gap:8px; }
.api-input {
  flex:1; background:#040a12; border:1px solid var(--line); border-radius:8px;
  color:var(--text); font-family:var(--mono); font-size:12px; padding:10px 12px;
  outline:none; transition:border 0.2s; min-width:0;
}
.api-input:focus { border-color:var(--acc); }
.api-input::placeholder { color:#1a3050; }
.btn-primary {
  background: linear-gradient(135deg,var(--acc2),var(--acc));
  border:none; border-radius:8px; color:#fff;
  font-family:var(--mono); font-size:10px; letter-spacing:1.5px;
  padding:10px 14px; cursor:pointer; white-space:nowrap;
  transition:opacity .2s;
}
.btn-primary:active { opacity:.8; }
.api-saved { font-family:var(--mono); font-size:10px; color:#3aaa66; margin-top:8px; display:none; }
.api-hint { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5; }
.api-hint a { color:var(--acc); }

/* ── DROP ZONE ── */
.drop-zone {
  border: 2px dashed var(--line);
  border-radius: 16px;
  padding: 48px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .3s;
  background: rgba(255,255,255,.01);
  margin-bottom: 16px;
}
.drop-zone.over, .drop-zone:hover { border-color:var(--acc); background:rgba(61,142,240,.05); }
.drop-emoji { font-size:44px; display:block; margin-bottom:14px; opacity:.5; }
.drop-title { font-size:15px; color:#ddeeff; margin-bottom:6px; }
.drop-sub { font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:1px; }
#file-input { display:none; }

/* ── LOADING ── */
#loading { display:none; text-align:center; padding:60px 20px; }
.spin { font-size:38px; display:inline-block; animation:spin 1.4s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.load-text { font-family:var(--mono); font-size:12px; color:var(--acc); letter-spacing:3px; margin-top:16px; }
.load-sub { font-size:12px; color:var(--muted); margin-top:6px; }

/* ── ERROR ── */
#error-box { display:none; background:#1a0608; border:1px solid #882020; border-radius:10px; padding:14px 16px; margin-bottom:16px; font-family:var(--mono); font-size:12px; color:#ff6060; }

/* ── RESULTS ── */
#results { display:none; }

.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.year-tabs { display:flex; gap:6px; flex-wrap:wrap; }
.y-tab {
  background:var(--bg2); border:1px solid var(--line); border-radius:20px;
  color:var(--muted); font-family:var(--mono); font-size:10px; letter-spacing:1.5px;
  padding:5px 12px; cursor:pointer; transition:all .2s;
}
.y-tab.active { background:rgba(61,142,240,.18); border-color:var(--acc); color:var(--acc); }
.y-tab.all-tab { border-color:var(--gold); color:var(--gold); }
.y-tab.all-tab.active { background:rgba(232,160,32,.12); }

.btn-reset {
  background:transparent; border:1px solid var(--line); border-radius:6px;
  color:var(--muted); font-family:var(--mono); font-size:10px; letter-spacing:1.5px;
  padding:6px 12px; cursor:pointer;
}

/* ── SECTION ── */
.section { margin-bottom:24px; }
.sec-title {
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
}
.sec-title::before { content:''; width:3px; height:16px; background:linear-gradient(var(--acc),var(--acc2)); border-radius:2px; flex-shrink:0; }
.sec-title span { font-family:var(--mono); font-size:9px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; }

/* ── TOTALS GRID ── */
.totals-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.total-card {
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:14px 12px; text-align:center;
}
.total-card.big { grid-column:1/-1; background:linear-gradient(135deg,#0d1f3a,#091528); border-color:#3d8ef033; }
.tc-label { font-family:var(--mono); font-size:8px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
.tc-value { font-family:var(--mono); font-size:22px; font-weight:700; color:#ddeeff; }
.total-card.big .tc-value { font-size:32px; color:var(--acc); }
.tc-sub { font-size:10px; color:var(--muted); margin-top:3px; }

/* ── AIRCRAFT TABLE ── */
.ac-table { width:100%; border-collapse:collapse; }
.ac-table th {
  font-family:var(--mono); font-size:9px; letter-spacing:1.5px; color:var(--muted);
  text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
  text-transform:uppercase;
}
.ac-table td { font-family:var(--mono); font-size:12px; color:var(--text); padding:10px 10px; border-bottom:1px solid #ffffff06; }
.ac-table tr:last-child td { border-bottom:none; }
.ac-table tr.total-row td { color:var(--acc); font-size:13px; border-top:1px solid var(--line); }
.ac-wrap { background:var(--bg2); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.bar-mini { height:3px; border-radius:2px; background:linear-gradient(90deg,var(--acc2),var(--acc)); margin-top:4px; }

/* ── LANDINGS ── */
.land-list { display:flex; flex-direction:column; gap:8px; }
.land-item {
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; display:flex; align-items:center; gap:12px;
}
.land-rank { font-family:var(--mono); font-size:10px; color:var(--muted); width:20px; flex-shrink:0; }
.land-rank.top3 { color:var(--gold); }
.land-icao { font-family:var(--mono); font-size:14px; color:#ddeeff; flex:1; }
.land-count { font-family:var(--mono); font-size:18px; color:var(--acc); font-weight:700; }
.land-bar-wrap { flex:1; height:4px; background:rgba(255,255,255,.05); border-radius:2px; }
.land-bar { height:4px; border-radius:2px; background:linear-gradient(90deg,var(--acc2),var(--acc)); }

/* ── BOTTOM NAV ── */
#bottom-nav {
  display:none;
  flex-shrink:0;
  background:rgba(6,13,24,.95);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding: 8px 0 calc(8px + var(--safe-bottom));
  display:flex;
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-family:var(--mono); font-size:8px; letter-spacing:1px; padding:6px 0;
  transition:color .2s;
}
.nav-btn.active { color:var(--acc); }
.nav-icon { font-size:18px; }

/* panels */
.panel { display:none; }
.panel.active { display:block; }
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <span class="hd-icon">✈</span>
    <div>
      <div class="hd-title">CARNET DE VOL</div>
      <div class="hd-sub">LOGBOOK</div>
    </div>
  </div>
  <div id="pilot-badge">
    <div class="pb-name" id="pb-name"></div>
    <div class="pb-years" id="pb-years"></div>
  </div>
</header>

<div id="scroll-area">

  <!-- SETUP -->
  <div id="setup-area">
    <div class="setup-card">
      <div class="setup-label">Clé API Anthropic</div>
      <div class="api-row">
        <input class="api-input" type="password" id="api-key" placeholder="sk-ant-api03-…"/>
        <button class="btn-primary" onclick="saveKey()">OK</button>
      </div>
      <div class="api-saved" id="api-saved">✓ Clé enregistrée</div>
      <div class="setup-label" style="margin-top:14px;">Modèle</div>
      <select id="model-select" class="api-input" style="width:100%;cursor:pointer;background:#040a12;" onchange="saveModel()">
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
        <option value="claude-sonnet-4-5-20251022">Claude Sonnet 4.5</option>
        <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
        <option value="claude-3-haiku-20240307">Claude 3 Haiku</option>
      </select>
      <div class="api-hint">
        Créez votre clé sur <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a><br/>
        Elle est stockée uniquement sur votre appareil.
      </div>
    </div>

    <div class="drop-zone" id="drop-zone"
      onclick="document.getElementById('file-input').click()"
      ondragover="dOver(event)" ondragleave="dLeave()" ondrop="dDrop(event)">
      <span class="drop-emoji">📄</span>
      <div class="drop-title">Ajouter un carnet PDF</div>
      <div class="drop-sub">DÉPOSER OU APPUYER</div>
    </div>
    <input type="file" id="file-input" accept=".pdf" onchange="handleFile(this.files[0])"/>

    <div id="loading">
      <div class="spin">⟳</div>
      <div class="load-text">ANALYSE EN COURS</div>
      <div class="load-sub">Claude lit votre carnet…</div>
    </div>
    <div id="error-box"></div>
  </div>

  <!-- RESULTS -->
  <div id="results">
    <div class="top-bar">
      <div class="year-tabs" id="year-tabs"></div>
      <button class="btn-reset" onclick="addAnother()">+ PDF</button>
    </div>

    <!-- panel: stats -->
    <div class="panel active" id="panel-stats">
      <div class="section">
        <div class="sec-title"><span>Heures totales</span></div>
        <div class="totals-grid" id="totals-grid"></div>
      </div>
      <div class="section">
        <div class="sec-title"><span>Par type d'avion</span></div>
        <div class="ac-wrap"><table class="ac-table" id="ac-table"></table></div>
      </div>
    </div>

    <!-- panel: landings -->
    <div class="panel" id="panel-land">
      <div class="section">
        <div class="sec-title"><span>Posées par lieu</span></div>
        <div class="land-list" id="land-list"></div>
      </div>
    </div>
  </div>

</div><!-- /scroll-area -->

<!-- bottom nav (always visible) -->
<nav id="bottom-nav" style="display:flex;">
  <button class="nav-btn active" id="nav-stats" onclick="switchNav('stats')">
    <span class="nav-icon">📊</span>HEURES
  </button>
  <button class="nav-btn" id="nav-land" onclick="switchNav('land')">
    <span class="nav-icon">🛬</span>POSÉES
  </button>
  <button class="nav-btn" id="nav-add" onclick="addAnother()">
    <span class="nav-icon">➕</span>AJOUTER
  </button>
</nav>

<script>
// ── storage ──────────────────────────────────────────────────────────────────
const DB_KEY = 'cvol_data_v2';
let allData = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
// allData: array of { annee, pilote, vols:[{type_avion,jour,nuit,total,atterrissages,arrivee}] }

let currentYear = 'ALL';
let currentNav  = 'stats';

// ── init ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const k = localStorage.getItem('cvol_api');
  if (k) { el('api-key').value = k; el('api-saved').style.display = 'block'; }
  const m = localStorage.getItem('cvol_model');
  if (m) { el('model-select').value = m; }
  if (allData.length) renderAll();
});

// ── service worker ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── helpers ───────────────────────────────────────────────────────────────────
function el(id){ return document.getElementById(id); }
function show(id){ el(id).style.display=''; }
function hide(id){ el(id).style.display='none'; }
function toHM(m){
  if(!m||m<=0) return '0h00';
  return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
}

// ── API key ───────────────────────────────────────────────────────────────────
function saveKey(){
  const k = el('api-key').value.trim();
  if(!k) return;
  localStorage.setItem('cvol_api', k);
  el('api-saved').style.display = 'block';
}
function saveModel(){
  localStorage.setItem('cvol_model', el('model-select').value);
}

// ── drag ──────────────────────────────────────────────────────────────────────
function dOver(e){ e.preventDefault(); el('drop-zone').classList.add('over'); }
function dLeave(){ el('drop-zone').classList.remove('over'); }
function dDrop(e){ e.preventDefault(); dLeave(); handleFile(e.dataTransfer.files[0]); }

// ── file ──────────────────────────────────────────────────────────────────────
async function handleFile(file){
  if(!file||file.type!=='application/pdf'){ showErr('Sélectionnez un PDF.'); return; }
  const key = localStorage.getItem('cvol_api') || el('api-key').value.trim();
  if(!key){ showErr('Entrez votre clé API Anthropic d\'abord.'); return; }

  hide('drop-zone'); hide('error-box');
  el('loading').style.display = 'block';

  try {
    const b64 = await toBase64(file);
    const data = await callClaude(b64, key);
    mergeData(data);
    el('file-input').value = '';
    renderAll();
  } catch(e){
    showErr('Erreur : ' + e.message);
    show('drop-zone');
  } finally {
    el('loading').style.display = 'none';
  }
}

function toBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ── Claude ────────────────────────────────────────────────────────────────────
async function callClaude(b64, key){
  const sys = `Tu es un expert en carnets de vol militaires français.
Analyse ce PDF et retourne UNIQUEMENT un JSON valide (pas de markdown, pas de backticks) :
{
  "pilote": "NOM Prénom",
  "annee": "2019",
  "vols": [
    { "type_avion":"A310", "jour":60, "nuit":218, "total":278, "atterrissages":1, "arrivee":"OLBA" }
  ]
}
RÈGLES :
- Durées en MINUTES (1h00 = 60, 5h04 = 304)
- Extrais CHAQUE ligne de vol individuelle (pas les bilans)
- arrivee = code ICAO de destination depuis la colonne OBSERVATIONS
- Retourne SEULEMENT le JSON`;

  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{ 'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
    body:JSON.stringify({
      model: localStorage.getItem('cvol_model') || 'claude-3-5-haiku-20241022', max_tokens:8000, system:sys,
      messages:[{ role:'user', content:[
        { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 }},
        { type:'text', text:'Extrais toutes les données.' }
      ]}]
    })
  });
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${r.status}`); }
  const json = await r.json();
  const txt  = json.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim();
  return JSON.parse(txt);
}

// ── data management ───────────────────────────────────────────────────────────
function mergeData(incoming){
  // remove existing same year, add new
  allData = allData.filter(d=>d.annee !== incoming.annee);
  allData.push({ annee:incoming.annee, pilote:incoming.pilote, vols:incoming.vols });
  allData.sort((a,b)=>a.annee.localeCompare(b.annee));
  localStorage.setItem(DB_KEY, JSON.stringify(allData));
}

// ── render ────────────────────────────────────────────────────────────────────
function renderAll(){
  if(!allData.length) return;

  // header
  const last = allData[allData.length-1];
  el('pb-name').textContent = last.pilote || '';
  el('pb-years').textContent = allData.map(d=>d.annee).join(' · ');
  el('pilot-badge').style.display = 'block';

  // year tabs
  const tabsEl = el('year-tabs');
  tabsEl.innerHTML = '';
  // ALL tab
  const allTab = document.createElement('button');
  allTab.className = 'y-tab all-tab' + (currentYear==='ALL'?' active':'');
  allTab.textContent = 'TOTAL';
  allTab.onclick = ()=>{ currentYear='ALL'; renderAll(); };
  tabsEl.appendChild(allTab);
  // per year
  allData.forEach(d=>{
    const b = document.createElement('button');
    b.className = 'y-tab' + (currentYear===d.annee?' active':'');
    b.textContent = d.annee;
    b.onclick = ()=>{ currentYear=d.annee; renderAll(); };
    tabsEl.appendChild(b);
  });

  // gather vols for current selection
  const vols = currentYear==='ALL'
    ? allData.flatMap(d=>d.vols)
    : (allData.find(d=>d.annee===currentYear)?.vols||[]);

  // totals
  const tJour  = vols.reduce((a,v)=>a+v.jour,0);
  const tNuit  = vols.reduce((a,v)=>a+v.nuit,0);
  const tTotal = vols.reduce((a,v)=>a+v.total,0);

  el('totals-grid').innerHTML = `
    <div class="total-card big">
      <div class="tc-label">Total</div>
      <div class="tc-value">${toHM(tTotal)}</div>
      <div class="tc-sub">${vols.length} vol${vols.length>1?'s':''}</div>
    </div>
    <div class="total-card">
      <div class="tc-label">Jour</div>
      <div class="tc-value" style="font-size:18px;">${toHM(tJour)}</div>
    </div>
    <div class="total-card">
      <div class="tc-label">Nuit</div>
      <div class="tc-value" style="font-size:18px;color:#7aaaff">${toHM(tNuit)}</div>
    </div>`;

  // by aircraft
  const byAC = {};
  vols.forEach(v=>{
    if(!byAC[v.type_avion]) byAC[v.type_avion]={jour:0,nuit:0,total:0};
    byAC[v.type_avion].jour  += v.jour;
    byAC[v.type_avion].nuit  += v.nuit;
    byAC[v.type_avion].total += v.total;
  });
  const maxAC = Math.max(...Object.values(byAC).map(d=>d.total),1);
  const acRows = Object.entries(byAC)
    .sort((a,b)=>b[1].total-a[1].total)
    .map(([type,d])=>`
      <tr>
        <td>${type}</td>
        <td>${toHM(d.jour)}</td>
        <td style="color:#7aaaff">${toHM(d.nuit)}</td>
        <td style="color:var(--acc)">${toHM(d.total)}
          <div class="bar-mini" style="width:${Math.round((d.total/maxAC)*100)}%"></div>
        </td>
      </tr>`).join('');
  el('ac-table').innerHTML = `
    <thead><tr><th>Type</th><th>Jour</th><th>Nuit</th><th>Total</th></tr></thead>
    <tbody>${acRows}
    <tr class="total-row"><td>TOTAL</td><td>${toHM(tJour)}</td><td>${toHM(tNuit)}</td><td>${toHM(tTotal)}</td></tr>
    </tbody>`;

  // landings
  const poses = {};
  vols.forEach(v=>{
    if(v.atterrissages>0 && v.arrivee){
      poses[v.arrivee] = (poses[v.arrivee]||0) + v.atterrissages;
    }
  });
  const sorted = Object.entries(poses).sort((a,b)=>b[1]-a[1]);
  const maxP = sorted[0]?.[1] || 1;
  const totalPoses = sorted.reduce((a,[,n])=>a+n,0);
  const byPays = {};
  sorted.forEach(([icao,n])=>{ const p=icaoToPays(icao); const k=p.flag+' '+p.nom; byPays[k]=(byPays[k]||0)+n; });
  const sortedPays = Object.entries(byPays).sort((a,b)=>b[1]-a[1]);

  el('land-list').innerHTML =
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      <div class="total-card">
        <div class="tc-label">Aéroports</div>
        <div class="tc-value" style="font-size:22px;">${sorted.length}</div>
        <div class="tc-sub">${totalPoses} posée${totalPoses>1?'s':''}</div>
      </div>
      <div class="total-card">
        <div class="tc-label">Pays</div>
        <div class="tc-value" style="font-size:22px;color:var(--gold)">${sortedPays.length}</div>
      </div>
    </div>
    <div class="sec-title"><span>Par pays</span></div>
    <div style="background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;">
      ${sortedPays.map(([pays,n],i)=>`
        <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #ffffff06;">
          <div style="font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;">${i+1}.</div>
          <div style="flex:1;font-family:var(--mono);font-size:13px;color:#ddeeff;">${pays}</div>
          <div style="font-family:var(--mono);font-size:16px;color:var(--gold);font-weight:700;">${n}</div>
        </div>`).join('')}
    </div>
    <div class="sec-title"><span>Par aéroport</span></div>
    ${sorted.map(([icao,n],i)=>`
    <div class="land-item">
      <div class="land-rank ${i<3?'top3':''}">${i<3?['①','②','③'][i]:`${i+1}.`}</div>
      <div style="flex:1;">
        <div class="land-icao">${icao}</div>
        <div style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px;">${icaoToPays(icao).flag} ${icaoToPays(icao).nom}</div>
      </div>
      <div class="land-bar-wrap"><div class="land-bar" style="width:${Math.round((n/maxP)*100)}%"></div></div>
      <div class="land-count">${n}</div>
    </div>`).join('')}`;

  // show results
  hide('setup-area');
  el('results').style.display = 'block';
  switchNav(currentNav);
}

// ── nav ───────────────────────────────────────────────────────────────────────
function switchNav(name){
  if(name==='add'){ addAnother(); return; }
  currentNav = name;
  ['stats','land'].forEach(n=>{
    el('panel-'+n).classList.toggle('active', n===name);
    el('nav-'+n).classList.toggle('active', n===name);
  });
  el('scroll-area').scrollTop = 0;
}

function addAnother(){
  el('results').style.display = 'none';
  show('setup-area');
  show('drop-zone');
  hide('error-box');
  hide('loading');
}

// ── error ─────────────────────────────────────────────────────────────────────
function showErr(msg){
  el('error-box').textContent = '⚠ ' + msg;
  el('error-box').style.display = 'block';
  show('drop-zone');
}

// ── ICAO → Pays ──────────────────────────────────────────────────────────────
function icaoToPays(icao) {
  if(!icao) return {nom:'?', flag:''};
  const p2 = icao.slice(0,2).toUpperCase();
  const p1 = icao[0].toUpperCase();
  // [nom, code ISO pour drapeau]
  const m2 = {
    'LF':['France','FR'],'LT':['Turquie','TR'],'LI':['Italie','IT'],
    'LE':['Espagne','ES'],'LD':['Croatie','HR'],'LG':['Grèce','GR'],
    'LP':['Portugal','PT'],'LY':['Serbie','RS'],'LZ':['Slovaquie','SK'],
    'LO':['Autriche','AT'],'LS':['Suisse','CH'],'LB':['Bulgarie','BG'],
    'LH':['Hongrie','HU'],'LK':['Tchéquie','CZ'],'LR':['Roumanie','RO'],
    'LL':['Israël','IL'],'LM':['Malte','MT'],'LJ':['Slovénie','SI'],
    'EH':['Pays-Bas','NL'],'EB':['Belgique','BE'],'ED':['Allemagne','DE'],
    'EG':['Royaume-Uni','GB'],'EI':['Irlande','IE'],'EK':['Danemark','DK'],
    'EN':['Norvège','NO'],'EP':['Pologne','PL'],'ES':['Suède','SE'],
    'EF':['Finlande','FI'],'EV':['Lettonie','LV'],'EY':['Lituanie','LT'],
    'EE':['Estonie','EE'],'OL':['Liban','LB'],'OI':['Iran','IR'],
    'OJ':['Jordanie','JO'],'OE':['Arabie Saoudite','SA'],'OK':['Koweït','KW'],
    'OO':['Oman','OM'],'OT':['Qatar','QA'],'OS':['Syrie','SY'],
    'DI':["Côte d'Ivoire",'CI'],'DN':['Nigeria','NG'],'DR':['Niger','NE'],
    'DT':['Tunisie','TN'],'DG':['Ghana','GH'],
    'FE':['Centrafrique','CF'],'FF':['Centrafrique','CF'],
    'FM':['Madagascar','MG'],'FR':['Réunion','RE'],'FN':['Angola','AO'],
    'FO':['Gabon','GA'],'FT':['Tchad','TD'],'FZ':['Congo RDC','CD'],
    'FA':['Afrique du Sud','ZA'],'FC':['Congo','CG'],'FK':['Cameroun','CM'],
    'FL':['Zambie','ZM'],'FV':['Zimbabwe','ZW'],'FW':['Malawi','MW'],
    'GM':['Maroc','MA'],'GO':['Sénégal','SN'],'GU':['Guinée','GN'],
    'GL':['Libéria','LR'],'GF':['Sierra Leone','SL'],'GV':['Cap-Vert','CV'],
    'HA':['Éthiopie','ET'],'HE':['Égypte','EG'],'HK':['Kenya','KE'],
    'HS':['Soudan','SD'],'HT':['Tanzanie','TZ'],'HU':['Ouganda','UG'],
    'HR':['Rwanda','RW'],'HC':['Somalie','SO'],
    'NW':['Nouvelle-Calédonie','NC'],'NT':['Polynésie Fr.','PF'],
    'TF':['Martinique','MQ'],'TT':['Trinité','TT'],'TX':['Bermudes','BM'],
    'CF':['Canada','CA'],'CY':['Canada','CA'],
    'UA':['Kazakhstan','KZ'],'UB':['Azerbaïdjan','AZ'],'UG':['Géorgie','GE'],
    'UK':['Ukraine','UA'],'UM':['Biélorussie','BY'],'UU':['Russie','RU'],
    'ZB':['Chine','CN'],'ZS':['Chine','CN'],'RJ':['Japon','JP'],
    'RK':['Corée du Sud','KR'],'VT':['Thaïlande','TH'],
    'VH':['Australie','AU'],'RP':['Philippines','PH'],
    'PH':['Hawaï','US'],'PHNL':['Hawaï','US'],'CYVR':['Canada','CA'],
    'OLBA':['Liban','LB'],'TFFF':['Martinique','MQ'],
    'NWWW':['Nouvelle-Calédonie','NC'],
  };
  const r = m2[icao.toUpperCase()] || m2[p2];
  if(r) return {nom:r[0], flag:isoToFlag(r[1])};
  const fallback = {'L':'Europe','E':'Europe Nord','K':'États-Unis','C':'Canada','M':'Mexique','S':'Amér. Sud','T':'Caraïbes','F':'Afrique','G':'Afrique O.','H':'Afrique E.','N':'Pacifique','O':'Moyen-Orient','P':'Pacifique N.','R':'Asie','U':'Ex-URSS','V':'Asie S.','W':'Asie SE','Y':'Australie','Z':'Asie E.'};
  return {nom: fallback[p1] || '?', flag:''};
}

function isoToFlag(iso) {
  if(!iso||iso.length!==2) return '';
  return String.fromCodePoint(...[...iso.toUpperCase()].map(c=>0x1F1E6-65+c.charCodeAt(0)));
}

</script>
